<form onsubmit="return false;">
    <div class="operation-form">
        <div class="operation-form-title">Limit</div>

        <div class="form-grid">
            <div class="form-field form-field-wide">
                <label for="limit-n">Number of rows</label>
                <input type="number" name="n" id="limit-n" class="form-input"
                       min="1" max="{{ row_count }}" placeholder="e.g. 10" required>
                <span class="form-hint">Current file has {{ row_count }} rows.</span>
            </div>
        </div>

        {% if error %}
            <div class="limit-error">{{ error }}</div>
        {% else %}
            <div class="result-banner">
                <span class="result-before">{{ rows_before }}</span>
                <span class="result-arrow">→</span>
                <span class="result-after">{{ rows_after }} rows</span>
                <span class="result-diff">({{ diff }} removed)</span>
            </div>
        {% endif %}

        <div class="form-actions">
            <button class="btn-apply" type="button"
                    hx-post="/limit-operation"
                    hx-include="closest form"
                    hx-target="#footer-slot"
                    hx-swap="innerHTML">Apply</button>

            <button class="btn-cancel" type="button"
                    hx-get="/close-slot"
                    hx-target="#footer-slot"
                    hx-swap="innerHTML">Cancel</button>
        </div>
    </div>
</form>
