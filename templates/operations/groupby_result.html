<form method="post" action="/groupby-edit"
      hx-post="/groupby-edit"
      hx-target="#footer-slot"
      hx-swap="innerHTML">
    <div class="operation-form">
        <div class="operation-form-title">Group By</div>

        {% if error %}
        <div class="limit-error">{{ error }}</div>
        {% else %}
        <div class="result-banner">
            <span class="result-before">{{ rows_before }}</span>
            <span class="result-arrow">→</span>
            <span class="result-after">{{ rows_after }} groups</span>
            <span class="result-diff">
                {{ summary_group }}{% if summary_aggs %} · {{ summary_aggs }}{% endif %}
            </span>
        </div>
        {% endif %}

        {% include "operations/groupby_rows.html" %}

        <div class="form-actions">
            <button type="submit" name="action" value="apply" class="btn-apply">Apply</button>
            <button type="button" class="btn-cancel"
                    hx-get="/close-slot" hx-target="#footer-slot" hx-swap="innerHTML">Cancel</button>
        </div>
    </div>
</form>
